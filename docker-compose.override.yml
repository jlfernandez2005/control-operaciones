services:
  app:
    build:
      context: .
      target: deps
    command: npm run dev
    environment:
      NODE_ENV: development
      COOKIE_SECURE: "false"
    volumes:
      - ./server:/app/server
      - ./public:/app/public
      - ./scripts:/app/scripts
      - ctrl-ops-data:/app/data
    ports:
      - "3000:3000"

  nginx:
    profiles: ["prod"]

  certbot:
    profiles: ["prod"]