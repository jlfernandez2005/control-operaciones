name: Verificación SISFIA
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, ssisfia-pruebas-v5]
permissions:
  contents: read
jobs:
  local-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -r scripts/requirements-finance.txt
      - run: npm run test:static && npm run test:flow && npm run test:treasury && npm run test:dates && npm run test:payroll && npm run test:storage && npm run test:erp && npm run test:daily
      - run: npm run test:validation
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - run: python -m pip install pip-audit && pip-audit -r scripts/requirements-finance.txt
