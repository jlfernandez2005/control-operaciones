services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET}
      PAYROLL_DATA_KEY: ${PAYROLL_DATA_KEY:-}
      SISFIA_ENCRYPTION_KEY: ${SISFIA_ENCRYPTION_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DB_PATH: /app/data/control.db
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-}
      COMPANY_CODE: ${COMPANY_CODE:-LSALLE}
      COMPANY_NAME: ${COMPANY_NAME:-La Salle Lima}
      APP_ORIGIN: ${APP_ORIGIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
    volumes:
      - ctrl-ops-data:/app/data
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  ctrl-ops-data:
